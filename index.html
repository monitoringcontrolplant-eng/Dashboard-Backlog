<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Dashboard - Backlog Management</title>
    <!-- Tailwind CSS untuk Styling Tampilan -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

    <div class="max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Executive Dashboard</h1>

        <!-- KARTU EXECUTIVE DASHBOARD -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            
            <!-- 1. TOTAL UNIQUE MO -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Total Unique MO</span>
                    <span class="p-2 bg-blue-50 text-blue-600 rounded-lg">📋</span>
                </div>
                <div id="card-total-mo" class="text-3xl font-extrabold text-gray-900">0</div>
                <p class="text-xs text-gray-400 mt-2">Total nomor MO unik</p>
            </div>

            <!-- 2. MO READY EKSEKUSI (BACA KOLOM X) -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">MO Ready Eksekusi</span>
                    <span class="p-2 bg-emerald-50 text-emerald-600 rounded-lg">✔</span>
                </div>
                <div id="card-mo-ready" class="text-3xl font-extrabold text-emerald-600">0</div>
                <p class="text-xs text-gray-400 mt-2">▼ Filter Ready (Dari Kolom X Status MO)</p>
            </div>

            <!-- 3. MO NOT READY (BACA KOLOM X) -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-bold text-amber-600 uppercase tracking-wider">MO Not Ready</span>
                    <span class="p-2 bg-amber-50 text-amber-600 rounded-lg">⏳</span>
                </div>
                <div id="card-mo-not-ready" class="text-3xl font-extrabold text-amber-600">0</div>
                <p class="text-xs text-gray-400 mt-2">▼ Filter Not Ready (Dari Kolom X Status MO)</p>
            </div>

        </div>
    </div>

    <!-- SCRIPT LOGIKA PERHITUNGAN BACA SPREADSHEET -->
    <script>
        /**
         * Fungsi pemroses data spreadsheet
         * @param {Array} rawData - Data baris dari spreadsheet (Array of Objects atau Array of Arrays)
         */
        function updateDashboardCards(rawData) {
            const setTotalMO = new Set();
            const setReadyMO = new Set();
            const setNotReadyMO = new Set();

            rawData.forEach(row => {
                // 1. Ambil No MO (Sesuaikan index/key jika header berbeda)
                const noMO = row["No MO"] || row[0]; // Kolom A atau key 'No MO'
                
                // 2. Ambil Status MO dari KOLOM X (Index array ke-23 jika data mentah berupa array)
                //    Atau nama header 'Status MO' / 'STATUS MO'
                const statusMO = (row["Status MO"] || row["STATUS MO"] || row[23] || "").toString().trim().toUpperCase();

                if (noMO) {
                    setTotalMO.add(noMO);

                    // Pengecekan status MO dari Kolom X
                    if (statusMO === "READY EKSEKUSI" || statusMO === "SIAP DI EKSEKUSI" || statusMO === "READY") {
                        setReadyMO.add(noMO);
                    } else if (statusMO === "NOT READY" || statusMO === "BELUM READY") {
                        setNotReadyMO.add(noMO);
                    }
                }
            });

            // 3. Tampilkan hasil perhitungan Unik ke HTML
            document.getElementById("card-total-mo").innerText = setTotalMO.size.toLocaleString("id-ID");
            document.getElementById("card-mo-ready").innerText = setReadyMO.size.toLocaleString("id-ID");
            document.getElementById("card-mo-not-ready").innerText = setNotReadyMO.size.toLocaleString("id-ID");
        }

        // --- CONTOH SIMULASI DATA SPREADSHEET ---
        // Kolom X adalah 'Status MO'
        const contohDataSpreadsheet = [
            { "No MO": "MO-001", "Status MO": "Ready Eksekusi" },
            { "No MO": "MO-001", "Status MO": "Ready Eksekusi" }, // Duplikat MO, hanya dihitung 1
            { "No MO": "MO-002", "Status MO": "Not Ready" },
            { "No MO": "MO-003", "Status MO": "Ready Eksekusi" },
            { "No MO": "MO-004", "Status MO": "NOT READY" },
            { "No MO": "MO-005", "Status MO": "CLOSE" }
        ];

        // Jalankan kalkulasi kartu saat halaman dimuat
        document.addEventListener("DOMContentLoaded", () => {
            updateDashboardCards(contohDataSpreadsheet);
        });
    </script>
</body>
</html>
