<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Backlog Management System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    .bg-login-gradient {
      background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%);
    }
    .glow-effect {
      box-shadow: 0 0 50px -12px rgba(99, 102, 241, 0.25);
    }
  </style>
</head>
<body class="min-h-screen bg-login-gradient flex items-center justify-center p-4 sm:p-6 lg:p-8">

  <!-- Container Utama -->
  <div class="w-full max-w-md bg-[#111827] border border-slate-800/80 rounded-3xl shadow-2xl p-8 sm:p-10 glow-effect relative">
    
    <!-- Header Brand -->
    <div class="flex items-center gap-3 mb-8">
      <img src="BSS_logo.jpg" alt="BSS Logo" class="h-8 w-auto" onerror="this.style.display='none'">
      <div>
        <h1 class="font-extrabold text-sm tracking-wider text-white uppercase">BACKLOG SYSTEM</h1>
        <p class="text-[10px] text-indigo-400 font-bold tracking-widest uppercase">MANAGEMENT BACKLOG 2026</p>
      </div>
    </div>

    <div class="mb-6">
      <h2 class="text-2xl font-bold text-white tracking-tight">Selamat Datang</h2>
      <p class="text-xs text-slate-400 mt-1">Silakan masuk untuk mengakses portal Backlog Management.</p>
    </div>

    <!-- Alert Error Login -->
    <div id="loginError" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-400 font-medium flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="loginErrorMsg">Username atau Password salah!</span>
    </div>

    <!-- Form Login -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">Username / ID Pengguna</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-xs">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="username" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700/60 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" placeholder="Masukkan username">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-xs">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="password" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700/60 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" placeholder="Masukkan password">
        </div>
      </div>

      <button type="submit" class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 active:scale-[0.98]">
        Masuk Ke Sistem
      </button>
    </form>
  </div>

  <!-- Logic JavaScript -->
  <script>
    function handleLogin(event) {
      // Mencegah reload halaman bawaan form
      event.preventDefault();

      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('loginError');
      const errorMsg = document.getElementById('loginErrorMsg');

      // Credential Default
      const validUser = "admin";
      const validPass = "admin123";

      if (usernameInput === validUser && passwordInput === validPass) {
        errorDiv.classList.add('hidden');
        alert("Login Berhasil! Mengalihkan halaman...");
        
         Ganti 'dashboard.html' dengan nama file halaman utama kamu jika sudah ada
         window.location.href = 'dashboard.html';
      } else {
        errorDiv.classList.remove('hidden');
        errorMsg.textContent = "Username atau Password salah!";
      }
    }
  </script>
</body>
</html>
